<!DOCTYPE html>
<html>
<head>

    <title>Stock Alert - Products</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #222;
        }

        /* SIDEBAR */

        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 30px 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 45px;
        }

        .logo span {
            color: #38bdf8;
        }

        .nav a {
            display: block;
            text-decoration: none;
            color: #cbd5e1;
            padding: 14px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        .nav a:hover,
        .nav a.active {
            background: #2563eb;
            color: white;
        }

        /* MAIN */

        .main {
            margin-left: 230px;
            padding: 35px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            color: #64748b;
            margin-top: 5px;
        }

        .add-btn {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* FORM */

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .form-box h2 {
            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 7px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        .save-btn {
            margin-top: 20px;
            padding: 12px 25px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #15803d;
        }

        /* TABLE */

        .table-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
        }

        .table-box h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f1f5f9;
            text-align: left;
            padding: 14px;
            font-size: 14px;
        }

        td {
            padding: 14px;
            border-bottom: 1px solid #e5e7eb;
        }

        .low {
            color: #dc2626;
            font-weight: bold;
        }

        .normal {
            color: #16a34a;
            font-weight: bold;
        }

        .empty {
            color: #64748b;
            text-align: center;
            padding: 25px;
        }

        @media (max-width: 900px) {

            .sidebar {
                width: 190px;
            }

            .main {
                margin-left: 190px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


    <!-- SIDEBAR -->

    <div class="sidebar">

        <div class="logo">
            📦 Stock<span>Alert</span>
        </div>

        <div class="nav">

            <a href="/">
                🏠 Dashboard
            </a>

            <a href="/products-page" class="active">
                📦 Products
            </a>

            <a href="/movements-page">
                🔄 Stock Movements
            </a>

        </div>

    </div>


    <!-- MAIN -->

    <div class="main">


        <!-- HEADER -->

        <div class="header">

            <div>

                <h1>Products</h1>

                <p>
                    Manage your retail store inventory
                </p>

            </div>

            <button class="add-btn"
                    onclick="showForm()">

                + Add Product

            </button>

        </div>


        <!-- ADD PRODUCT FORM -->

        <div class="form-box"
             id="productForm"
             style="display:none;">

            <h2>Add New Product</h2>

            <div class="form-grid">

                <input
                    id="productName"
                    type="text"
                    placeholder="Product Name"
                >

                <input
                    id="category"
                    type="text"
                    placeholder="Category"
                >

                <input
                    id="price"
                    type="number"
                    placeholder="Price"
                >

                <input
                    id="quantity"
                    type="number"
                    placeholder="Quantity"
                >

                <input
                    id="reorderLevel"
                    type="number"
                    placeholder="Reorder Level"
                >

            </div>

            <button
                class="save-btn"
                onclick="addProduct()">

                Save Product

            </button>

        </div>


        <!-- PRODUCT TABLE -->

        <div class="table-box">

            <h2>📦 Product Inventory</h2>

            <table>

                <thead>

                    <tr>

                        <th>ID</th>

                        <th>Product</th>

                        <th>Category</th>

                        <th>Price</th>

                        <th>Quantity</th>

                        <th>Reorder Level</th>

                        <th>Status</th>

                    </tr>

                </thead>


                <tbody id="productTable">

                </tbody>

            </table>

        </div>


    </div>


    <!-- JAVASCRIPT -->

    <script>


        // =========================
        // SHOW FORM
        // =========================

        function showForm() {

            document.getElementById(
                "productForm"
            ).style.display = "block";

        }


        // =========================
        // LOAD PRODUCTS
        // =========================

        function loadProducts() {

            fetch("/products")

                .then(response => response.json())

                .then(products => {

                    let table =
                        document.getElementById(
                            "productTable"
                        );

                    table.innerHTML = "";


                    if (products.length === 0) {

                        table.innerHTML = `

                            <tr>

                                <td
                                    colspan="7"
                                    class="empty"
                                >

                                    No products found.

                                </td>

                            </tr>

                        `;

                        return;
                    }


                    products.forEach(product => {


                        let lowStock =
                            product.quantity
                            <= product.reorderLevel;


                        let status =
                            lowStock
                            ? "LOW STOCK"
                            : "NORMAL";


                        let statusClass =
                            lowStock
                            ? "low"
                            : "normal";


                        table.innerHTML += `

                            <tr>

                                <td>
                                    ${product.productId}
                                </td>

                                <td>
                                    ${product.productName}
                                </td>

                                <td>
                                    ${product.category}
                                </td>

                                <td>
                                    ₹${product.price}
                                </td>

                                <td>
                                    ${product.quantity}
                                </td>

                                <td>
                                    ${product.reorderLevel}
                                </td>

                                <td class="${statusClass}">
                                    ${status}
                                </td>

                            </tr>

                        `;

                    });

                })

                .catch(error => {

                    console.error(
                        "Error:",
                        error
                    );

                });

        }


        // =========================
        // ADD PRODUCT
        // =========================

        function addProduct() {


            let product = {

                productName:
                    document.getElementById(
                        "productName"
                    ).value,

                category:
                    document.getElementById(
                        "category"
                    ).value,

                price:
                    Number(
                        document.getElementById(
                            "price"
                        ).value
                    ),

                quantity:
                    Number(
                        document.getElementById(
                            "quantity"
                        ).value
                    ),

                reorderLevel:
                    Number(
                        document.getElementById(
                            "reorderLevel"
                        ).value
                    )

            };


            fetch("/products", {

                method: "POST",

                headers: {

                    "Content-Type":
                        "application/json"

                },

                body:
                    JSON.stringify(product)

            })

            .then(response => response.json())

            .then(() => {


                // Clear form

                document.getElementById(
                    "productName"
                ).value = "";

                document.getElementById(
                    "category"
                ).value = "";

                document.getElementById(
                    "price"
                ).value = "";

                document.getElementById(
                    "quantity"
                ).value = "";

                document.getElementById(
                    "reorderLevel"
                ).value = "";


                // Hide form

                document.getElementById(
                    "productForm"
                ).style.display = "none";


                // Reload products

                loadProducts();

            })

            .catch(error => {

                console.error(
                    "Error adding product:",
                    error
                );

            });

        }


        // =========================
        // LOAD WHEN PAGE OPENS
        // =========================

        loadProducts();


    </script>


</body>

</html>
